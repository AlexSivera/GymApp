name: Deploy web to GitHub Pages

# Builds the Flutter web target and publishes it to GitHub Pages on every
# push to main — the free, no-Mac-needed path to a PWA that can be added to
# a phone's home screen. One-time manual step: enable Settings > Pages >
# Build and deployment > Source > "GitHub Actions" on this repo, or this
# workflow's deploy step has nothing to publish to.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Served at https://<user>.github.io/GymApp/ — base-href must match
      # the repo name or every asset/route resolves to the wrong path.
      # --no-web-resources-cdn serves the rendering engine (CanvasKit) from
      # this site instead of Google's CDN, so the offline service worker can
      # cache it — otherwise the app still needs the internet to start.
      - run: flutter build web --release --base-href /GymApp/ --no-web-resources-cdn
      # Offline support: writes build/web/sw.js with this build's file list.
      - run: dart run tool/generate_service_worker.dart
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
