name: Build Android APK

# Free alternative to Codemagic when its quota runs out: builds the debug-
# signed release APK (same debug.keystore committed in android/app, so it
# installs over a previous Codemagic build without uninstalling first) and
# attaches it to the workflow run. Public repo, so GitHub Actions minutes
# don't cost anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gymapp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
